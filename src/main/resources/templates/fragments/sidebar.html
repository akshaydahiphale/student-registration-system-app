<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside th:fragment="sidebar" class="sidebar" id="sidebar">
    <ul class="nav flex-column py-3">
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active' : ''" href="/dashboard">
                <i class="bi bi-speedometer2 me-2"></i>Dashboard
            </a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:classappend="${activePage == 'students'} ? 'active' : ''" href="/students">
                <i class="bi bi-people-fill me-2"></i>All Students
            </a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" href="/students/new">
                <i class="bi bi-person-plus-fill me-2"></i>Add Student
            </a>
			
			
        </li>
		
		<li class="nav-item" sec:authorize="hasRole('ADMIN')">
		    <a class="nav-link" href="/users/new">
		        <i class="bi bi-person-badge-fill me-2"></i>Add User
		    </a>
		</li>
		
		<li class="nav-item" sec:authorize="hasRole('ADMIN')">
		    <a class="nav-link" href="/users/pending">
		        <i class="bi bi-person-check-fill me-2"></i>Pending Approvals
		    </a>
		</li>
        <li class="nav-item" sec:authorize="hasRole('STUDENT')">
            <a class="nav-link" href="/profile">
                <i class="bi bi-person-badge me-2"></i>My Profile
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/change-password">
                <i class="bi bi-key-fill me-2"></i>Change Password
            </a>
        </li>
        <li class="nav-item mt-3">
            <form th:action="@{/logout}" method="post" class="px-3">
                <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </form>
        </li>
    </ul>
</aside>
</body>
</html>
