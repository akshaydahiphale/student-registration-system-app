<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark top-navbar px-3">
    <a class="navbar-brand fw-bold" href="/dashboard">
        <i class="bi bi-mortarboard-fill me-2"></i>Student Registration System
    </a>
    <button class="btn btn-link text-white d-lg-none" id="sidebarToggle">
        <i class="bi bi-list fs-3"></i>
    </button>
    <div class="ms-auto d-flex align-items-center">
        <span class="text-white me-3 d-none d-md-inline">
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="name">user</span>
            <span class="badge bg-light text-dark ms-1" sec:authorize="hasRole('ADMIN')">ADMIN</span>
            <span class="badge bg-light text-dark ms-1" sec:authorize="hasRole('STUDENT')">STUDENT</span>
        </span>
        <div class="dropdown">
            <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-gear-fill"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="/change-password"><i class="bi bi-key me-2"></i>Change Password</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
