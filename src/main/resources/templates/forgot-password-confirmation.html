<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Link Sent - Student Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-wrapper">
    <div class="auth-card card shadow-lg border-0">
        <div class="card-body p-4 p-md-5 text-center">
            <i class="bi bi-check-circle-fill display-4 text-success"></i>
            <h3 class="fw-bold mt-2">Reset Link Generated</h3>
            <p class="text-muted">
                In a production system this link would be emailed to you. For this
                demo, use the link below directly:
            </p>
            <div class="alert alert-info small text-break">
                <a th:href="@{${resetLink}}" th:text="${resetLink}"></a>
            </div>
            <a th:href="@{${resetLink}}" class="btn btn-primary w-100">
                <i class="bi bi-arrow-right-circle me-2"></i>Continue to Reset Password
            </a>
            <a href="/login" class="btn btn-link w-100 mt-2">Back to Login</a>
        </div>
    </div>
</div>
</body>
</html>
