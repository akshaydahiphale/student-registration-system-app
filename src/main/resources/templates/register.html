<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="text-center mb-4">
                <i class="bi bi-mortarboard-fill display-4 text-primary"></i>
                <h3 class="fw-bold mt-2">Student Self-Registration</h3>
                <p class="text-muted">Fill in your details — your account will be reviewed by an admin before you can log in.</p>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/register}" th:object="${selfRegisterDTO}" method="post"
                          enctype="multipart/form-data" novalidate>

                        <h6 class="text-primary fw-bold mb-3">Personal Details</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">First Name *</label>
                                <input type="text" class="form-control" th:field="*{firstName}"
                                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last Name *</label>
                                <input type="text" class="form-control" th:field="*{lastName}"
                                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Gender *</label>
                                <select class="form-select" th:field="*{gender}"
                                        th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid'">
                                    <option value="">-- Select --</option>
                                    <option value="MALE">MALE</option>
                                    <option value="FEMALE">FEMALE</option>
                                    <option value="OTHER">OTHER</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Date of Birth *</label>
                                <input type="date" class="form-control" th:field="*{dateOfBirth}"
                                       th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Mobile Number *</label>
                                <input type="text" class="form-control" th:field="*{mobileNumber}"
                                       th:classappend="${#fields.hasErrors('mobileNumber')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('mobileNumber')}" th:errors="*{mobileNumber}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Photo</label>
                                <input type="file" class="form-control" name="photo" accept="image/png,image/jpeg,image/webp">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Address *</label>
                                <input type="text" class="form-control" th:field="*{address}"
                                       th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">City *</label>
                                <input type="text" class="form-control" th:field="*{city}"
                                       th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">State *</label>
                                <input type="text" class="form-control" th:field="*{state}"
                                       th:classappend="${#fields.hasErrors('state')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Pin Code *</label>
                                <input type="text" class="form-control" th:field="*{pinCode}"
                                       th:classappend="${#fields.hasErrors('pinCode')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('pinCode')}" th:errors="*{pinCode}"></div>
                            </div>
                        </div>

                        <h6 class="text-primary fw-bold mt-4 mb-3">Academic Details</h6>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Course *</label>
                                <input type="text" class="form-control" th:field="*{course}" placeholder="e.g. B.Tech"
                                       th:classappend="${#fields.hasErrors('course')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Branch *</label>
                                <input type="text" class="form-control" th:field="*{branch}" placeholder="e.g. Computer Science"
                                       th:classappend="${#fields.hasErrors('branch')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('branch')}" th:errors="*{branch}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Semester *</label>
                                <select class="form-select" th:field="*{semester}"
                                        th:classappend="${#fields.hasErrors('semester')} ? 'is-invalid'">
                                    <option value="">-- Select --</option>
                                    <option th:each="s : ${#numbers.sequence(1,8)}" th:value="${s}" th:text="${s}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('semester')}" th:errors="*{semester}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Admission Date *</label>
                                <input type="date" class="form-control" th:field="*{admissionDate}"
                                       th:classappend="${#fields.hasErrors('admissionDate')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('admissionDate')}" th:errors="*{admissionDate}"></div>
                            </div>
                        </div>

                        <h6 class="text-primary fw-bold mt-4 mb-3">Login Details</h6>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Username *</label>
                                <input type="text" class="form-control" th:field="*{username}"
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Password *</label>
                                <input type="password" class="form-control" th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Confirm Password *</label>
                                <input type="password" class="form-control" th:field="*{confirmPassword}"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>

                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-2"></i>Register
                            </button>
                            <a href="/login" class="btn btn-outline-secondary">Already have an account? Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
