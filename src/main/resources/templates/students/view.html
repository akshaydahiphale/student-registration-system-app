<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Student: ' + ${student.fullName}">Student Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="container-fluid py-4">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card shadow-sm text-center">
                        <div class="card-body">
                            <img th:if="${student.photoPath}" th:src="@{'/uploads/' + ${student.photoPath}}"
                                 class="rounded-circle photo-preview mb-3" alt="photo">
                            <i th:unless="${student.photoPath}" class="bi bi-person-circle display-1 text-secondary mb-3 d-block"></i>
                            <h5 class="fw-bold mb-0" th:text="${student.fullName}"></h5>
                            <p class="text-muted" th:text="${student.studentId}"></p>
                            <span class="badge fs-6" th:classappend="${student.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${student.status}"></span>

                            <div class="d-grid gap-2 mt-4" sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{'/students/' + ${student.id} + '/edit'}" class="btn btn-warning">
                                    <i class="bi bi-pencil me-2"></i>Edit Student
                                </a>
                                <a href="/students" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left me-2"></i>Back to List
                                </a>
                            </div>

                            <div class="d-grid gap-2 mt-4" sec:authorize="hasRole('STUDENT')">
                                <a th:href="@{/profile/edit}" class="btn btn-outline-primary">
                                    <i class="bi bi-pencil me-2"></i>Edit Profile
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card shadow-sm">
                        <div class="card-header bg-white"><i class="bi bi-person-lines-fill me-2"></i>Personal Details</div>
                        <div class="card-body">
                            <dl class="row mb-0">
                                <dt class="col-sm-4">Gender</dt>
                                <dd class="col-sm-8" th:text="${student.gender}"></dd>

                                <dt class="col-sm-4">Date of Birth</dt>
                                <dd class="col-sm-8" th:text="${#temporals.format(student.dateOfBirth, 'dd-MMM-yyyy')}"></dd>

                                <dt class="col-sm-4">Mobile Number</dt>
                                <dd class="col-sm-8" th:text="${student.mobileNumber}"></dd>

                                <dt class="col-sm-4">Email</dt>
                                <dd class="col-sm-8" th:text="${student.email}"></dd>

                                <dt class="col-sm-4">Address</dt>
                                <dd class="col-sm-8" th:text="${student.address}"></dd>

                                <dt class="col-sm-4">City / State</dt>
                                <dd class="col-sm-8" th:text="${student.city} + ', ' + ${student.state}"></dd>

                                <dt class="col-sm-4">Pin Code</dt>
                                <dd class="col-sm-8" th:text="${student.pinCode}"></dd>
                            </dl>
                        </div>
                    </div>

                    <div class="card shadow-sm mt-3">
                        <div class="card-header bg-white"><i class="bi bi-mortarboard me-2"></i>Academic Details</div>
                        <div class="card-body">
                            <dl class="row mb-0">
                                <dt class="col-sm-4">Course</dt>
                                <dd class="col-sm-8" th:text="${student.course}"></dd>

                                <dt class="col-sm-4">Branch</dt>
                                <dd class="col-sm-8" th:text="${student.branch}"></dd>

                                <dt class="col-sm-4">Semester</dt>
                                <dd class="col-sm-8" th:text="${student.semester}"></dd>

                                <dt class="col-sm-4">Admission Date</dt>
                                <dd class="col-sm-8" th:text="${#temporals.format(student.admissionDate, 'dd-MMM-yyyy')}"></dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
