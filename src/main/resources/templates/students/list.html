<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Student Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold mb-0"><i class="bi bi-people-fill me-2"></i>All Students</h4>
                <a href="/students/new" class="btn btn-primary">
                    <i class="bi bi-person-plus-fill me-2"></i>Add Student
                </a>
            </div>

            <div class="alert alert-success alert-dismissible fade show" th:if="${successMessage}" th:text="${successMessage}">
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Search & Filter -->
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <form method="get" th:action="@{/students}" class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label small text-muted">Search</label>
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                                   placeholder="ID, name, or email">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small text-muted">Course</label>
                            <input type="text" class="form-control" name="course" th:value="${course}" placeholder="e.g. B.Tech">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small text-muted">Branch</label>
                            <input type="text" class="form-control" name="branch" th:value="${branch}" placeholder="e.g. CSE">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small text-muted">Semester</label>
                            <select class="form-select" name="semester">
                                <option value="">All</option>
                                <option th:each="s : ${#numbers.sequence(1,8)}" th:value="${s}" th:text="${s}"
                                        th:selected="${semester != null and semester == s}"></option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="bi bi-search"></i> Search
                            </button>
                            <a href="/students" class="btn btn-outline-secondary"><i class="bi bi-x-lg"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Photo</th>
                                <th>
                                    <a class="sort-link" th:href="@{/students(keyword=${keyword},course=${course},branch=${branch},semester=${semester},sortBy='studentId',direction=${reverseDirection})}">
                                        Student ID <i class="bi bi-arrow-down-up"></i>
                                    </a>
                                </th>
                                <th>
                                    <a class="sort-link" th:href="@{/students(keyword=${keyword},course=${course},branch=${branch},semester=${semester},sortBy='firstName',direction=${reverseDirection})}">
                                        Name <i class="bi bi-arrow-down-up"></i>
                                    </a>
                                </th>
                                <th>Course</th>
                                <th>Branch</th>
                                <th>
                                    <a class="sort-link" th:href="@{/students(keyword=${keyword},course=${course},branch=${branch},semester=${semester},sortBy='semester',direction=${reverseDirection})}">
                                        Semester <i class="bi bi-arrow-down-up"></i>
                                    </a>
                                </th>
                                <th>Mobile</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="student : ${studentPage.content}">
                                <td>
                                    <img th:if="${student.photoPath}" th:src="@{'/uploads/' + ${student.photoPath}}"
                                         class="avatar-sm rounded-circle" alt="photo">
                                    <i th:unless="${student.photoPath}" class="bi bi-person-circle fs-3 text-secondary"></i>
                                </td>
                                <td><span class="fw-semibold" th:text="${student.studentId}"></span></td>
                                <td th:text="${student.fullName}"></td>
                                <td th:text="${student.course}"></td>
                                <td th:text="${student.branch}"></td>
                                <td th:text="${student.semester}"></td>
                                <td th:text="${student.mobileNumber}"></td>
                                <td>
                                    <span class="badge" th:classappend="${student.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${student.status}"></span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{'/students/' + ${student.id}}" class="btn btn-sm btn-outline-primary" title="View">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{'/students/' + ${student.id} + '/edit'}" class="btn btn-sm btn-outline-warning" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger" title="Delete"
                                            data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${student.id}">
                                        <i class="bi bi-trash"></i>
                                    </button>

                                    <div class="modal fade" th:id="'deleteModal' + ${student.id}" tabindex="-1">
                                        <div class="modal-dialog modal-dialog-centered">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h5 class="modal-title">Confirm Delete</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                </div>
                                                <div class="modal-body">
                                                    Are you sure you want to delete <strong th:text="${student.fullName}"></strong>
                                                    (<span th:text="${student.studentId}"></span>)? This action cannot be undone.
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                                    <form th:action="@{'/students/' + ${student.id} + '/delete'}" method="post">
                                                        <button type="submit" class="btn btn-danger">Delete</button>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${studentPage.content.isEmpty()}">
                                <td colspan="9" class="text-center text-muted py-4">No students found.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card-footer bg-white d-flex justify-content-between align-items-center flex-wrap gap-2"
                     th:if="${studentPage.totalPages > 0}">
                    <span class="small text-muted">
                        Showing page <span th:text="${studentPage.number + 1}"></span> of
                        <span th:text="${studentPage.totalPages}"></span>
                        (<span th:text="${studentPage.totalElements}"></span> total students)
                    </span>
                    <nav>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${studentPage.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/students(keyword=${keyword},course=${course},branch=${branch},semester=${semester},sortBy=${sortBy},direction=${direction},page=${studentPage.number - 1})}">Previous</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, studentPage.totalPages - 1)}"
                                th:classappend="${i == studentPage.number} ? 'active'">
                                <a class="page-link" th:href="@{/students(keyword=${keyword},course=${course},branch=${branch},semester=${semester},sortBy=${sortBy},direction=${direction},page=${i})}" th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${studentPage.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/students(keyword=${keyword},course=${course},branch=${branch},semester=${semester},sortBy=${sortBy},direction=${direction},page=${studentPage.number + 1})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
