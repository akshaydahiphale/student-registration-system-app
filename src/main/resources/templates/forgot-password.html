<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Student Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-wrapper">
    <div class="auth-card card shadow-lg border-0">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-key-fill display-4 text-primary"></i>
                <h3 class="fw-bold mt-2">Forgot Password</h3>
                <p class="text-muted">Enter your username and registered email to reset your password</p>
            </div>

            <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <ul class="alert alert-danger" th:if="${#fields.hasErrors('forgotPasswordDTO.*')}">
                <li th:each="err : ${#fields.errors('forgotPasswordDTO.*')}" th:text="${err}"></li>
            </ul>

            <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" th:field="*{username}" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Registered Email</label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="Enter registered email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-send-fill me-2"></i>Send Reset Link
                </button>
                <a href="/login" class="btn btn-link w-100 mt-2">Back to Login</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
