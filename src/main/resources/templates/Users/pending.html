<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pending Approvals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="container-fluid py-4">
            <h4 class="fw-bold mb-4"><i class="bi bi-person-check-fill"></i> Pending Approvals</h4>

            <div class="alert alert-success alert-dismissible fade show" th:if="${successMessage}" th:text="${successMessage}">
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(pendingUsers)}" class="text-center text-muted py-4">
                        No pending registrations.
                    </div>
                    <table class="table table-hover" th:unless="${#lists.isEmpty(pendingUsers)}">
                        <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Linked Student</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${pendingUsers}">
                            <td th:text="${u.username}"></td>
                            <td th:text="${u.email}"></td>
                            <td th:text="${u.student != null} ? ${u.student.fullName} : '-'"></td>
                            <td>
                                <form th:action="@{'/users/' + ${u.id} + '/approve'}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-success btn-sm">
                                        <i class="bi bi-check-circle me-1"></i>Approve
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
