<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0"><i class="bi bi-speedometer2 me-2"></i>Dashboard</h4>
                <a href="/students/new" class="btn btn-primary">
                    <i class="bi bi-person-plus-fill me-2"></i>Add Student
                </a>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="card stat-card stat-primary shadow-sm h-100">
                        <div class="card-body">
                            <div class="stat-icon"><i class="bi bi-people-fill"></i></div>
                            <div class="stat-value" th:text="${stats.totalStudents}">0</div>
                            <div class="stat-label">Total Students</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card stat-card stat-success shadow-sm h-100">
                        <div class="card-body">
                            <div class="stat-icon"><i class="bi bi-person-check-fill"></i></div>
                            <div class="stat-value" th:text="${stats.activeStudents}">0</div>
                            <div class="stat-label">Active Students</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card stat-card stat-info shadow-sm h-100">
                        <div class="card-body">
                            <div class="stat-icon"><i class="bi bi-gender-male"></i></div>
                            <div class="stat-value" th:text="${stats.maleStudents}">0</div>
                            <div class="stat-label">Male Students</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card stat-card stat-warning shadow-sm h-100">
                        <div class="card-body">
                            <div class="stat-icon"><i class="bi bi-gender-female"></i></div>
                            <div class="stat-value" th:text="${stats.femaleStudents}">0</div>
                            <div class="stat-label">Female Students</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <i class="bi bi-clock-history me-2"></i>Recently Registered Students
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Photo</th>
                                <th>Student ID</th>
                                <th>Name</th>
                                <th>Course</th>
                                <th>Branch</th>
                                <th>Semester</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="student : ${stats.recentlyRegistered}">
                                <td>
                                    <img th:if="${student.photoPath}" th:src="@{'/uploads/' + ${student.photoPath}}"
                                         class="avatar-sm rounded-circle" alt="photo">
                                    <i th:unless="${student.photoPath}" class="bi bi-person-circle fs-3 text-secondary"></i>
                                </td>
                                <td th:text="${student.studentId}"></td>
                                <td th:text="${student.fullName}"></td>
                                <td th:text="${student.course}"></td>
                                <td th:text="${student.branch}"></td>
                                <td th:text="${student.semester}"></td>
                                <td>
                                    <span class="badge" th:classappend="${student.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${student.status}"></span>
                                </td>
                                <td>
                                    <a th:href="@{'/students/' + ${student.id}}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${stats.recentlyRegistered.isEmpty()}">
                                <td colspan="8" class="text-center text-muted py-4">No students registered yet.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
