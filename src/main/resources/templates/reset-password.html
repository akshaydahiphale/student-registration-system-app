<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Student Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-wrapper">
    <div class="auth-card card shadow-lg border-0">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill display-4 text-primary"></i>
                <h3 class="fw-bold mt-2">Reset Password</h3>
                <p class="text-muted">Enter a new password for your account</p>
            </div>

            <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <ul class="alert alert-danger" th:if="${#fields.hasErrors('resetPasswordDTO.*')}">
                <li th:each="err : ${#fields.errors('resetPasswordDTO.*')}" th:text="${err}"></li>
            </ul>

            <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
                <input type="hidden" th:field="*{token}">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" th:field="*{newPassword}" placeholder="At least 6 characters" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="Re-enter new password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-check-circle me-2"></i>Reset Password
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
